[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoc-nn"
version = "0.1.0"
description = "ONNX to CMSIS-NN code generation toolkit for Cortex-M targets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "onnx>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
ui = [
  "PySide6>=6.7",
  "pyinstaller>=6.11",
]

[project.scripts]
nanoc = "nanoc_nn.cli:main"
nanoc-onnx-to-cmsis = "nanoc_nn.pipeline.cli:main"
nanoc-onnx-converter = "nanoc_nn.converter.cli:main"
nanoc-cmsis-codegen = "nanoc_nn.codegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nanoc_nn*"]

[tool.setuptools.package-data]
"nanoc_nn.codegen" = ["templates/*.tpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
