[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoc-onnx-converter"
version = "0.1.0"
description = "ONNX parser and C weight exporter for NanoC-NN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "onnx>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
examples = [
  "numpy==1.26.4",
  "onnx==1.16.2",
  "onnxruntime==1.18.1",
  "torch==2.2.2",
]

[project.scripts]
nanoc-onnx-converter = "nanoc_onnx_converter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoc_onnx_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
