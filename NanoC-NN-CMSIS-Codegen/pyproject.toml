[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoc-cmsis-codegen"
version = "0.1.0"
description = "CMSIS-NN C project generator for NanoC-NN ONNX converter outputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
nanoc-cmsis-codegen = "nanoc_cmsis_codegen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoc_cmsis_codegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
