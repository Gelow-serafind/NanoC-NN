<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNIST Capture</title>
  <style>
    :root {
      --ink: #15181c;
      --muted: #65707d;
      --line: #d7dde4;
      --paper: #f7f4ec;
      --panel: #ffffff;
      --accent: #0b6b5f;
      --accent-strong: #094b43;
      --danger: #a33a2a;
      --shadow: 0 18px 45px rgba(31, 39, 47, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      background:
        linear-gradient(135deg, rgba(11, 107, 95, 0.12), transparent 34%),
        radial-gradient(circle at 82% 12%, rgba(163, 58, 42, 0.10), transparent 26%),
        var(--paper);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
      display: grid;
      grid-template-columns: minmax(320px, 540px) 1fr;
      gap: 24px;
      align-items: start;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 6vw, 62px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(21, 24, 28, 0.08);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .draw-panel {
      display: grid;
      gap: 14px;
    }

    .canvas-wrap {
      aspect-ratio: 1;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050505;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    .label-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }

    button,
    select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: 600 15px ui-sans-serif, system-ui, sans-serif;
    }

    button {
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button.active,
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button.danger {
      color: var(--danger);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font: 13px ui-sans-serif, system-ui, sans-serif;
    }

    .preview {
      image-rendering: pixelated;
      width: 112px;
      height: 112px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #050505;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font: 14px ui-sans-serif, system-ui, sans-serif;
    }

    .samples {
      max-height: 340px;
      overflow: auto;
      display: grid;
      gap: 8px;
      font: 14px ui-sans-serif, system-ui, sans-serif;
    }

    .sample {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(21, 24, 28, 0.08);
      padding: 8px 0;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="draw-panel panel">
      <div>
        <h1>MNIST Capture</h1>
        <p>Draw a digit, choose its label, and save it into the persistent TDD fixture dataset.</p>
      </div>

      <div class="canvas-wrap">
        <canvas id="draw" width="280" height="280"></canvas>
      </div>

      <div class="label-grid" id="labels"></div>

      <div class="toolbar">
        <button class="primary" id="save">Save sample</button>
        <button class="danger" id="clear">Clear</button>
        <canvas class="preview" id="preview" width="28" height="28"></canvas>
      </div>

      <div class="status" id="status"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <p>Dataset</p>
        <div class="stats">
          <div class="stat"><strong id="count">0</strong><span>samples</span></div>
          <div class="stat"><strong id="label">0</strong><span>active label</span></div>
          <div class="stat"><strong>28</strong><span>pixels square</span></div>
        </div>
      </section>

      <section class="panel">
        <p>Recent samples</p>
        <div class="samples" id="samples"></div>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector("#draw");
    const ctx = canvas.getContext("2d");
    const preview = document.querySelector("#preview");
    const pctx = preview.getContext("2d");
    const labels = document.querySelector("#labels");
    const statusEl = document.querySelector("#status");
    const countEl = document.querySelector("#count");
    const labelEl = document.querySelector("#label");
    const samplesEl = document.querySelector("#samples");
    let drawing = false;
    let activeLabel = 0;

    function resetCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      updatePreview();
    }

    function drawAt(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX;
      const y = (event.clientY - rect.top) * scaleY;
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      updatePreview();
    }

    function updatePreview() {
      pctx.imageSmoothingEnabled = true;
      pctx.fillStyle = "#000";
      pctx.fillRect(0, 0, 28, 28);
      pctx.drawImage(canvas, 0, 0, 28, 28);
    }

    function pixels28() {
      updatePreview();
      const data = pctx.getImageData(0, 0, 28, 28).data;
      const pixels = [];
      for (let i = 0; i < data.length; i += 4) {
        pixels.push(Number((data[i] / 255).toFixed(6)));
      }
      return pixels;
    }

    async function refreshDataset() {
      const res = await fetch("/api/dataset");
      const dataset = await res.json();
      const samples = dataset.samples || [];
      countEl.textContent = samples.length;
      samplesEl.innerHTML = samples.slice(-20).reverse().map((sample) => {
        const label = sample.label === null || sample.label === undefined ? "-" : sample.label;
        return `<div class="sample"><span>${sample.id}</span><strong>${label}</strong></div>`;
      }).join("");
    }

    async function saveSample() {
      const pixels = pixels28();
      const ink = pixels.reduce((sum, item) => sum + item, 0);
      if (ink < 2) {
        statusEl.textContent = "Draw a little more before saving.";
        return;
      }
      const res = await fetch("/api/samples", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({label: activeLabel, float_pixels: pixels})
      });
      const data = await res.json();
      if (!data.ok) {
        statusEl.textContent = data.error || "Save failed.";
        return;
      }
      statusEl.textContent = `Saved ${data.sample.id}`;
      resetCanvas();
      await refreshDataset();
    }

    function setLabel(value) {
      activeLabel = value;
      labelEl.textContent = value;
      [...labels.children].forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.label) === value);
      });
    }

    for (let i = 0; i < 10; i++) {
      const button = document.createElement("button");
      button.textContent = i;
      button.dataset.label = i;
      button.addEventListener("click", () => setLabel(i));
      labels.appendChild(button);
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;
      canvas.setPointerCapture(event.pointerId);
      drawAt(event);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (drawing) drawAt(event);
    });
    canvas.addEventListener("pointerup", () => {
      drawing = false;
    });
    canvas.addEventListener("pointercancel", () => {
      drawing = false;
    });

    document.querySelector("#clear").addEventListener("click", resetCanvas);
    document.querySelector("#save").addEventListener("click", saveSample);

    resetCanvas();
    setLabel(0);
    refreshDataset();
  </script>
</body>
</html>
